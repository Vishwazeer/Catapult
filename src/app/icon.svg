<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" />
  
  <!-- Catapult / Launcher Vector Symbol -->
  <g filter="url(#glow)">
    <!-- Main Launcher V-Arm Base -->
    <path d="M 160 380 L 220 270 C 230 250, 250 240, 275 245 L 360 260 L 320 380 Q 250 395 160 380 Z" fill="url(#iconGrad)" opacity="0.15" />
    
    <!-- Sleek Catapult Launcher Frame -->
    <path d="M 140 370 Q 220 340 256 250 Q 300 190 370 140" fill="none" stroke="url(#iconGrad)" stroke-width="42" stroke-linecap="round" />
    <path d="M 140 370 Q 260 380 340 290 Q 370 240 370 140" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" opacity="0.6" />

    <!-- Dynamic Rocket Launch Arc -->
    <path d="M 190 310 C 230 210, 310 150, 390 120" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
    
    <!-- Launch Projectile / Core Energy Orb -->
    <circle cx="400" cy="112" r="32" fill="#FFFFFF" />
    <circle cx="400" cy="112" r="18" fill="#10B981" />
  </g>
</svg>
